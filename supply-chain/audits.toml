
# cargo-vet audits file

[criteria.agent-safe-to-deploy]
description = """
Reviewed by an AI coding agent (not a human auditor) to the safe-to-deploy standard:
no serious security vulnerability to production software exposed to untrusted input.
Does not imply built-in safe-to-deploy, so downstream importers opt in explicitly via criteria-map.
"""
implies = "agent-safe-to-run"

[criteria.agent-safe-to-run]
description = """
Reviewed by an AI coding agent (not a human auditor) to the safe-to-run standard:
safe to compile and run in development, test, or build environments.
Does not imply built-in safe-to-run, so downstream importers opt in explicitly via criteria-map.
"""

[[audits.arrayvec]]
who = "Devon Jonte <devonjonte@users.noreply.github.com>"
criteria = "agent-safe-to-deploy"
delta = "0.7.6 -> 0.7.8"
notes = "Fixes ZST double-free in extend via mem::forget, adds safe spare_capacity_mut, 16-bit LenUint, and lifetime annotations."

[[audits.block-buffer]]
who = "Devon Jonte <devonjonte@users.noreply.github.com>"
criteria = "agent-safe-to-deploy"
version = "0.12.1"
notes = "Full line-by-line review of src/{lib,read,sealed}.rs (756 lines, no_std, no build.rs). Eager/Lazy buffer invariants enforced by sealed::BlockSizes (U1..=U255), ResetGuard restores invariants on compress/closure panic, and Clone::clone ptr::read duplicates only stack MaybeUninit + Copy pos."

[[audits.constant_time_eq]]
who = "Devon Jonte <devonjonte@users.noreply.github.com>"
criteria = "agent-safe-to-deploy"
version = "0.4.2"
notes = "Full line-by-line review of src/{lib,classic,generic,sse2,neon,dit}.rs (no build.rs, deny(clippy::undocumented_unsafe_blocks)). All unaligned/SIMD loads assert exact slice lengths, inline asm uses pure/nomem/nostack/preserves_flags behind matching target_feature guards, and aarch64 DIT uses RAII restoration with valid AtomicU8 discriminant caching."

[[audits.cpufeatures]]
who = "Devon Jonte <devonjonte@users.noreply.github.com>"
