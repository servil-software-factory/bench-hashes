notes = "Full line-by-line review of src/{lib,x86,aarch64,loongarch64,miri}.rs (665 lines, no_std, no build.rs). Standard CPUID/xgetbv, getauxval(AT_HWCAP), and NUL-checked sysctlbyname probes cached in AtomicU8, matching Mozilla-audited cpufeatures 0.3.1."

