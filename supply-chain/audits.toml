[[audits.getrandom]]
who = "Devon Jonte (AI coding agent)"
criteria = "agent-safe-to-deploy"
version = "0.2.17"
notes = "Line-by-line review of Cargo.toml and all 24 src/*.rs files (1,739 LOC, #![no_std], build = false). Thin OS CSPRNG bindings: Linux/Android SYS_getrandom with sys_fill_exact EINTR/short-read handling and /dev/urandom fallback only after POLLIN on /dev/random (O_CLOEXEC, pthread_mutex_t); macOS/OpenBSD getentropy in 256-byte chunks; Windows BCryptGenRandom in u32::MAX chunks; NetBSD Release/Acquire Weak dlsym or KERN_ARND; Solaris GRND_RANDOM; rdrand CPUID/AMD-family-17h/self_test checks. No network, no unexpected I/O, sound MaybeUninit initialization contract."

