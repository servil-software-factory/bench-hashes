# Supply-chain dependency policy for bench-hashes (BLAKE3 #479).
# Checked in CI via `cargo deny check` with a hash-verified cargo-deny binary.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/servil-software-factory/BLAKE3"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "CC0-1.0",
]
confidence-threshold = 0.8
