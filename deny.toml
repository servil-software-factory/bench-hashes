# Supply-chain dependency policy for bench-hashes (BLAKE3 #479).
# Checked in CI via `python3 tools/dependency_policy.py`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Wherever the package is in the graph. Left unset, these two look at
# direct dependencies alone.
unsound = "all"
unmaintained = "all"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/servil-software-factory/BLAKE3"]

[licenses]
version = 2
# The packages that only tests use are held to the list too.
include-dev = true
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "CC0-1.0",
    "TGPPL-1.0",
]
# BOSL-1.0 is welcome too (Zooko, November 23, 2026). SPDX has no identifier
# for it, so cargo-deny cannot read it directly: when a crate arrives under
# it, add both a `clarify` entry identifying its licence text (by file hash)
# as `LicenseRef-BOSL-1.0` and an entry allowing `LicenseRef-BOSL-1.0` (here
# or in `exceptions`).
confidence-threshold = 0.8
