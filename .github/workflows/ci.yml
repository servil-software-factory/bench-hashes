# Build, test, and run a quick benchmark on each platform GitHub hosts, so
# a change that breaks a platform no maintainer runs shows at once.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  build-test-run:
    strategy:
      fail-fast: false
      matrix:
        # The platforms bench-hashes supports (README; Windows is not, since
        # blake3-servil 0.8).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Line tables name the code in a stack trace; the code is the same.
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assignee workflow controls
        run: python3 tools/test_one_assignee.py
      - name: Pinned runner and fault controls
        if: runner.os == 'Linux'
        run: python3 tools/pinned-run/check.py --output "${{ runner.temp }}/pinned-run-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Linux'
        with:
          name: pinned-run-check-${{ matrix.os }}
          path: ${{ runner.temp }}/pinned-run-check/
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # check's coverage uses the toolchain's llvm-profdata and llvm-cov,
          # and a test holds that it takes them (check::tests).
          components: llvm-tools
      - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
      - run: cargo build --release --locked
      # Each test in its own process (AGENTS: "Tests run under nextest").
      - run: cargo nextest run --release --locked
      # The default suite checks the instrument's logic. The machine
      # profile runs on quiet benchmark hosts; hosted macOS CI has shown
      # 1.68-3.01 CPUs of unrelated work, which invalidates its load checks.
      # A quick run takes about a minute. On Linux, one that is still
      # running after ten prints every thread's stack and fails, so a hang
      # shows where it is.
      - name: A quick run
        shell: bash
        run: |
          if [ "$RUNNER_OS" != Linux ]; then exec cargo run --release --locked -- --quick; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb > /dev/null
          ./target/release/bench-hashes --quick & pid=$!
          for i in $(seq 600); do if ! kill -0 $pid 2> /dev/null; then wait $pid; exit $?; fi; sleep 1; done
          echo "the quick run is still running after 10 minutes; its threads:"
          sudo gdb -p $pid -batch -ex "thread apply all bt" 2>&1 | grep -v '^\[New LWP'
          kill $pid
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: benchmark-results/

  supply-chain:
    name: dependency policy (cargo-deny + cargo-vet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install hash-verified cargo-deny 0.22.0 and cargo-vet 0.10.4
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz
          echo "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786  /tmp/cargo-deny.tar.gz" | sha256sum -c
          tar zxf /tmp/cargo-deny.tar.gz -C /tmp --strip-components=1 --wildcards '*/cargo-deny'
          install -m 755 /tmp/cargo-deny ~/.cargo/bin/cargo-deny
          rm -f /tmp/cargo-deny.tar.gz /tmp/cargo-deny
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/cargo-vet.tar.xz https://github.com/mozilla/cargo-vet/releases/download/v0.10.4/cargo-vet-x86_64-unknown-linux-gnu.tar.xz
          echo "e367f8ac156208711511274abab0c309e19ed0f11ef2bbe8a7b0294f824cb032  /tmp/cargo-vet.tar.xz" | sha256sum -c
          tar Jxf /tmp/cargo-vet.tar.xz -C /tmp --strip-components=1 --wildcards '*/cargo-vet'
          install -m 755 /tmp/cargo-vet ~/.cargo/bin/cargo-vet
          rm -f /tmp/cargo-vet.tar.xz /tmp/cargo-vet
      - name: Check path allowlist, cargo-deny, and cargo-vet
        run: |
          python3 tools/test_dependency_policy.py
          python3 tools/dependency_policy.py

  python-tools:
    name: python tools (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The system's CPython, and PyPy: it has no reference counts, so a file
        # left unclosed stays unwritten, and it lacks some of CPython's os calls.
        python: [python3, pypy3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PyPy 8.0.1 (Python 3.12), by the SHA-256 pypy.org publishes
        if: matrix.python == 'pypy3'
        run: |
          case "$(uname -sm)" in
            "Linux x86_64") name=pypy3.12-v8.0.1-linux64 sha=aeed27797777296d9c94e53bdfa608804696dbd4ff9f2213003cce064ee46ef8 ;;
            "Darwin arm64") name=pypy3.12-v8.0.1-macos_arm64 sha=c10baeae4a61063a1183c4ee4e8324765ba736a3980323654efb31e79f1514db ;;
            *) echo "no PyPy named for $(uname -sm)"; exit 1 ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/pypy.tar.gz" "https://downloads.python.org/pypy/$name.tar.gz"
          echo "$sha  $RUNNER_TEMP/pypy.tar.gz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/pypy.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      - name: Tool tests and syntax check
        run: |
          ${{ matrix.python }} --version
          ${{ matrix.python }} -m py_compile tools/*.py tools/pinned-run/*.py
          ${{ matrix.python }} -W default tools/test_one_assignee.py
          ${{ matrix.python }} -W default tools/test_dependency_policy.py
      - name: Pinned runner and fault controls
        if: runner.os == 'Linux'
        run: ${{ matrix.python }} -W default tools/pinned-run/check.py --output "${{ runner.temp }}/pinned-run-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Linux'
        with:
          name: pinned-run-check-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/pinned-run-check/
